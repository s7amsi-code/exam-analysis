<header><div><h1>📊 منصة التحليل الذكي للاختبارات</h1><small>من البيانات إلى قرارات تعليمية فاعلة</small></div><div class="nav"><span id="dt"></span><button class="b" onclick="go('home')">الرئيسية</button><button class="b" onclick="newA()">+ تحليل جديد</button><button class="b" onclick="openReports()">🔒 التقارير المحفوظة</button><button class="b" onclick="settings()">⚙ الإعدادات</button><button class="b" id="lk" onclick="lock()" style="display:none">قفل</button></div></header>

<script>
const $=s=>document.querySelector(s),AD='٠١٢٣٤٥٦٧٨٩',ad=s=>String(s).replace(/\d/g,d=>AD[d]),f=(n,d=1)=>n==null||isNaN(n)?'—':ad(String(+(+n).toFixed(d))).replace('.','٫'),nm=s=>String(s).replace(/[٠-٩]/g,d=>AD.indexOf(d)).replace(/[٫,]/g,'.').trim();

const saveDB=()=>API||LS.set('ti_db',DB),saveST=()=>LS.set('ti_st',ST);let API=false,PW='',SUM=null;

function gate(cb){if(unlocked)return cb();const first=API?!SUM.configured:!ST.pw;const m=modal(`<h3>${first?'إنشاء كلمة مرور المشرف':'دخول المشرف'}</h3><p class="mu">التقارير المحفوظة متاحة للمشرف فقط.${first?' اختر كلمة مرور (٦ أحرف فأكثر) واحتفظ بها؛ لا يمكن استرجاعها.':''}</p><input id="p1" type="password" placeholder="كلمة المرور">${first?'<input id="p2" type="password" placeholder="تأكيد كلمة المرور">':''}<div id="pe" class="er"></div><div class="row"><button class="b p" id="pok">دخول</button><button class="b" id="pcn">إلغاء</button></div>`);
$('#pcn').onclick=()=>m.remove();const go_=async()=>{const a=$('#p1').value,e=$('#pe');if(first){if(a.length<6)return e.textContent='كلمة المرور قصيرة (٦ أحرف على الأقل).';if(a!==$('#p2').value)return e.textContent='كلمتا المرور غير متطابقتين.';if(API){try{await api('/auth','POST',{action:'setup',pw:a});SUM.configured=true}catch(x){return e.textContent='تعذر إنشاء كلمة المرور.'}}else{ST.pw=await sha(a);saveST()}}else if(API){PW=a;try{await api('/auth','POST',{action:'check'})}catch(x){PW='';return e.textContent='كلمة المرور غير صحيحة.'}}else if(await sha(a)!==ST.pw)return e.textContent='كلمة المرور غير صحيحة.';PW=a;unlocked=true;$('#lk').style.display='';try{await loadDB()}catch(x){}m.remove();cb()};$('#pok').onclick=go_;m.onkeydown=e=>{if(e.key=='Enter')go_()};setTimeout(()=>$('#p1').focus(),50)}
function lock(){unlocked=false;PW='';if(API)DB=[];$('#lk').style.display='none';go('home');toast('تم قفل التقارير')}
function go(v){CH.forEach(c=>c.destroy());CH=[];W&&v!='wiz'&&v!='rep'&&0;({home,wiz,reports,rep,cmp}[v]||home)();scrollTo(0,0)}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function lvOf(p){return ST.levels.find(l=>p>=l.min)||ST.levels[ST.levels.length-1]}
function calc(a){const Q=a.qs.map(q=>+q.pts),n=a.students.length,tot=Q.reduce((x,y)=>x+y,0);const T=a.students.map(s=>s.s.reduce((x,v)=>x+(+v||0),0)),P=T.map(t=>t/tot*100);const mean=avg(T),sd=Math.sqrt(avg(T.map(t=>(t-mean)**2))),srt=[...T].sort((x,y)=>x-y),med=n?(n%2?srt[(n-1)/2]:(srt[n/2-1]+srt[n/2])/2):0;
const L=ST.levels.map(l=>({...l,c:0}));P.forEach(p=>{L[ST.levels.indexOf(lvOf(p))].c++});
const q=Q.map((pt,j)=>{const col=a.students.map(s=>+s.s[j]||0),sum=col.reduce((x,y)=>x+y,0),pct=sum/(n*pt)*100;return{i:j,pt,lvl:String(a.qs[j].lvl).trim(),topic:a.qs[j].topic,mean:sum/n,pct,full:col.filter(v=>v>=pt).length,zero:col.filter(v=>v==0).length,col,cls:pct>=ST.hi?'مرتفع التحصيل':pct<ST.lo?'منخفض التحصيل':'متوسط التحصيل'}});
const cg=[...new Set(q.map(x=>x.lvl))].sort((a,b)=>(COG.indexOf(a)+1||99)-(COG.indexOf(b)+1||99)).map(c=>{const qs=q.filter(x=>x.lvl==c),pts=qs.reduce((x,y)=>x+y.pt,0),got=qs.reduce((x,y)=>x+y.mean*n,0);return{c,k:qs.length,pts,mean:pts?got/n:0,pct:pts?got/(n*pts)*100:null}}).filter(x=>x.k);
const hist=Array(10).fill(0);P.forEach(p=>hist[Math.min(9,Math.floor(p/10))]++);
const ord=T.map((t,i)=>i).sort((x,y)=>T[y]-T[x]),g=Math.max(1,Math.round(.27*n)),ok=n>=10;
q.forEach(x=>{x.D=ok?(avg(ord.slice(0,g).map(i=>x.col[i]))-avg(ord.slice(-g).map(i=>x.col[i])))/x.pt:null});
let alpha=null,aNote='';const vq=q.filter(x=>{const m=avg(x.col);return avg(x.col.map(v=>(v-m)**2))>0});
if(n<10)aNote='عدد الطلبة أقل من ١٠؛ المعامل غير موثوق ولم يُحسب.';else if(q.length<4)aNote='عدد الأسئلة أقل من ٤؛ لا يُحسب الثبات.';else if(vq.length<q.length)aNote='بعض الأسئلة لا تباين فيها (الجميع بالدرجة نفسها)؛ لا يُحسب المعامل.';else{const sv=x=>{const m=avg(x);return x.reduce((s,v)=>s+(v-m)**2,0)/(x.length-1)},k=q.length;alpha=k/(k-1)*(1-q.reduce((s,x)=>s+sv(x.col),0)/sv(T));aNote='يُفسَّر بحذر في الاختبارات القصيرة أو الأسئلة غير المتجانسة.'}
return{n,tot,T,P,mean,sd,med,pm:mean/tot*100,max:Math.max(...T),min:Math.min(...T),L,q,cg,hist,g,alpha,aNote,ord,hiN:P.filter(p=>p>=ST.hi).length,loN:P.filter(p=>p<ST.lo).length}}
function recs(a,C){const hq=C.q.filter(x=>x.pct>=ST.hi),lq=C.q.filter(x=>x.pct<ST.lo),qn=l=>l.map(x=>ad(x.i+1)).join('، '),S=[],I=[],R=[],E=[],T=[],cs=[...C.cg].sort((x,y)=>y.pct-x.pct),w=cs[cs.length-1],b=cs[0];
if(hq.length)S.push(`ارتفع التحصيل في الأسئلة (${qn(hq)}) إذ بلغ ${f(Math.min(...hq.map(x=>x.pct)))}٪ فأكثر.`);if(b&&b.pct>=ST.hi)S.push(`أقوى مستوى معرفي: ${b.c} بنسبة ${f(b.pct)}٪.`);if(C.pm>=ST.hi)S.push(`متوسط التحصيل العام ${f(C.pm)}٪ وهو أعلى من حد الإجادة (${f(ST.hi)}٪).`);if(!S.length)S.push('لم يبلغ أي سؤال أو مستوى معرفي حد الإجادة؛ يُنصح بالبناء على أعلى الأسئلة نسبياً: '+qn([...C.q].sort((x,y)=>y.pct-x.pct).slice(0,2)));
if(lq.length)I.push(`انخفض التحصيل في الأسئلة (${qn(lq)}) إلى ما دون ${f(ST.lo)}٪؛ أدناها السؤال ${ad([...lq].sort((x,y)=>x.pct-y.pct)[0].i+1)} بنسبة ${f([...lq].sort((x,y)=>x.pct-y.pct)[0].pct)}٪.`);if(w&&w.pct<ST.lo)I.push(`أضعف مستوى معرفي: ${w.c} بنسبة ${f(w.pct)}٪.`);const z=C.q.filter(x=>x.zero/C.n>=.25);if(z.length)I.push(`في الأسئلة (${qn(z)}) لم يحصل ربع الطلبة أو أكثر على أي درجة.`);if(!I.length)I.push('لا توجد أسئلة دون حد الدعم؛ يمكن التركيز على رفع الأسئلة الأقل نسبياً.');
const wl=C.cg.filter(x=>x.pct<ST.hi).sort((x,y)=>x.pct-y.pct).slice(0,2);wl.forEach(x=>R.push(`${x.c} (${f(x.pct)}٪): ${REM[String(x.c).split(' ')[0]]||'أنشطة علاجية مستهدفة لهذا المستوى'}.`));if(C.loN)R.push(`${ad(C.loN)} طالباً (${f(C.loN/C.n*100)}٪) دون ${f(ST.lo)}٪: مجموعات دعم صغيرة وتشخيص فردي قبل الاختبار القادم.`);if(!R.length)R.push('لا حاجة لخطة علاجية موسعة؛ يكفي تثبيت المفاهيم بتدريبات قصيرة.');
if(C.hiN)E.push(`${ad(C.hiN)} طالباً (${f(C.hiN/C.n*100)}٪) بلغوا حد الإجادة: مهام مفتوحة ومشروعات بحثية، وإسناد دور مرشد أقران.`);const hc=C.cg.filter(x=>x.pct>=ST.hi&&/^(استدلال|تطبيق)/.test(x.c))[0];E.push(hc?`تفوقوا في ${hc.c}: أسئلة أعلى مستوى معرفياً بعده.`:'أسئلة تحدٍّ من مستويات معرفية أعلى (التحليل والتقويم والإبداع).');
if(lq.length)T.push(`إعادة تدريس مفاهيم الأسئلة (${qn(lq)}) بطريقة مختلفة ثم إعادة تقويمها.`);if(C.sd/C.tot*100>20)T.push(`الانحراف المعياري ${f(C.sd)} (${f(C.sd/C.tot*100)}٪ من الدرجة): تفاوت كبير؛ اعتمد التدريس المتمايز.`);else T.push(`التشتت معتدل (انحراف ${f(C.sd)}): يناسب التدريس الصفي مع تغذية راجعة جماعية.`);const e=C.q.filter(x=>x.pct>=95);if(e.length)T.push(`الأسئلة (${qn(e)}) سهلة جداً (≥٩٥٪)؛ راجع صياغتها لتحقق التمييز.`);

const REM={معرفة:'بطاقات مراجعة وتكرار متباعد وخرائط مفاهيمية',تطبيق:'تدريبات متدرجة وأمثلة محلولة بالخطوات',استدلال:'أنشطة مقارنة وتعليل وحل مشكلات غير مألوفة'};

$('#app').innerHTML=`<div class="grid">${[['إجمالي التحليلات',S.n],['الاختبارات القصيرة',S.sh],['الاختبارات النهائية',S.fi],['إجمالي الطلبة',S.st],['متوسط التحصيل العام',S.pm!=null?f(S.pm)+'٪':'—']].map(x=>`<div class="st"><b>${typeof x[1]=='number'?ad(x[1]):x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>
<div class="row"><button class="b p" onclick="newA()">➕ إضافة تحليل جديد</button><button class="b" onclick="openReports()">🔒 عرض التقارير المحفوظة</button></div>
<div class="card" style="margin-top:14px"><h2>أحدث التحليلات</h2><div class="tw">${API&&!unlocked?'<p class="mu">🔒 قائمة التحليلات للمشرف فقط؛ تظهر بعد إدخال كلمة المرور من «التقارير المحفوظة».</p>':rec.length?`<table><tr><th>العنوان</th><th>الصف</th><th>المعلم</th><th>التاريخ</th><th>متوسط التحصيل</th><th></th></tr>${rec.map(a=>`<tr><td>${esc(a.title)}</td><td>${esc(a.grade)}</td><td>${esc(a.teacher)}</td><td>${ad(a.date||'')}</td><td>${f(calc(a).pm)}٪</td><td><button class="b" onclick="openRep('${a.id}')">عرض التقرير</button></td></tr>`).join('')}</table>`:'<p class="mu">لا توجد تحليلات بعد. ابدأ بإضافة تحليل جديد.</p>'}</div></div>`}

<div class="card"><div class="ph"><h1 style="text-align:center;color:#1e3a8a">منصة التحليل الذكي للاختبارات</h1></div><h2>${esc(a.title)}</h2><p class="mu">${a.type} · ${esc(a.subject)} · ${a.grade} · شعبة ${esc(a.section)} · الفصل ${a.term} · ${esc(a.year)} · المعلم: ${esc(a.teacher)} · ${ad(a.date||'')}</p></div>
<div class="card"><h2>١. ملخص الاختبار</h2><div class="grid">${sm('عدد الطلبة',ad(C.n))}${sm('الدرجة النهائية',f(C.tot))}${sm('المتوسط الحسابي',f(C.mean,2))}${sm('متوسط التحصيل',f(C.pm)+'٪')}${sm('أعلى درجة',f(C.max))}${sm('أدنى درجة',f(C.min))}${sm('الوسيط',f(C.med,2))}${sm('الانحراف المعياري',f(C.sd,2))}${sm('المجيدون (≥'+f(ST.hi)+'٪)',ad(C.hiN))}${sm('يحتاجون دعماً (<'+f(ST.lo)+'٪)',ad(C.loN))}</div></div>
<div class="card"><h2>٢. مستويات التحصيل</h2><div class="tw"><table><tr><th>المستوى</th><th>الحد الأدنى</th><th>العدد</th><th>النسبة</th></tr>${C.L.map((l,i)=>`<tr><td>${l.n}</td><td>${f(l.min)}٪</td><td>${ad(l.c)}</td><td>${f(pc[i])}٪</td></tr>`).join('')}</table></div><div class="grid"><div class="cv"><canvas id="c1"></canvas></div><div class="cv"><canvas id="c2"></canvas></div></div></div>
<div class="card"><h2>٣. أداء الأسئلة</h2><div class="tw"><table><tr><th>السؤال</th><th>الموضوع</th><th>القصوى</th><th>المتوسط</th><th>التحصيل ٪</th><th>الدرجة الكاملة</th><th>صفر</th><th>المستوى المعرفي</th><th>التصنيف</th></tr>${C.q.map(x=>`<tr><td>${ad(x.i+1)}</td><td>${esc(x.topic)}</td><td>${f(x.pt)}</td><td>${f(x.mean,2)}</td><td>${f(x.pct)}</td><td>${ad(x.full)}</td><td>${ad(x.zero)}</td><td>${x.lvl}</td><td>${x.cls}</td></tr>`).join('')}</table></div><p class="mu">نسبة التحصيل = مجموع درجات الطلبة في السؤال ÷ (عدد الطلبة × الدرجة القصوى) × ١٠٠. حدود التصنيف: مرتفع ≥ ${f(ST.hi)}٪، منخفض < ${f(ST.lo)}٪ (قابلة للتعديل من الإعدادات).</p><div class="cv"><canvas id="c3"></canvas></div></div>
<div class="card"><h2>٤. المستويات المعرفية</h2><div class="tw"><table><tr><th>المستوى</th><th>عدد الأسئلة</th><th>الدرجات</th><th>متوسط الطلبة</th><th>التحصيل ٪</th><th>الأداء</th></tr>${C.cg.map(x=>`<tr><td>${x.c}</td><td>${ad(x.k)}</td><td>${f(x.pts)}</td><td>${f(x.mean,2)}</td><td>${f(x.pct)}</td><td>${x.pct>=ST.hi?'قوة':x.pct<ST.lo?'ضعف':'متوسط'}</td></tr>`).join('')}</table></div><div class="cv"><canvas id="c4"></canvas></div></div>
<div class="card"><h2>٥. الفروق الفردية</h2><p>المدى: <b>${f(C.max-C.min)}</b> درجة (من ${f(C.min)} إلى ${f(C.max)}) · الانحراف المعياري: <b>${f(C.sd,2)}</b> (${f(C.sd/C.tot*100)}٪ من الدرجة النهائية)</p><p>الأعلى تحصيلاً: ${L(top)}</p><p>بحاجة إلى دعم: ${L(low)}</p><div class="cv"><canvas id="c5"></canvas></div></div>
<div class="card"><h2>٦. جودة الأسئلة (تحليل متقدم)</h2>${okD?'':'<p class="er">⚠ عدد الطلبة أقل من ١٠؛ معاملات التمييز والثبات غير معروضة لعدم كفاية البيانات.</p>'}<div class="tw"><table><tr><th>السؤال</th><th>الصعوبة</th><th>التفسير</th><th>التمييز</th><th>التفسير</th></tr>${C.q.map(x=>`<tr><td>${ad(x.i+1)}</td><td>${f(x.pct/100,2)}</td><td>${dif(x)}</td><td>${x.D==null?'—':f(x.D,2)}</td><td>${dsc(x)}</td></tr>`).join('')}</table></div><p class="mu"><b>معامل الصعوبة</b> = نسبة التحصيل في السؤال (ارتفاعه يعني سهولة السؤال). <b>معامل التمييز</b> = (متوسط المجموعة العليا − متوسط المجموعة الدنيا) ÷ درجة السؤال، باختيار أعلى وأدنى ٢٧٪ من الطلبة حسب المجموع الكلي (${ad(C.g)} طالباً في كل مجموعة)؛ ≥ ٠٫٤ ممتاز، ٠٫٣–٠٫٣٩ جيد، ٠٫٢–٠٫٢٩ مقبول، أقل من ٠٫٢ ضعيف.</p><p><b>معامل ألفا كرونباخ:</b> ${C.alpha==null?'غير متاح — '+C.aNote:f(C.alpha,2)+' — '+(C.alpha>=.7?'ثبات مقبول':'ثبات منخفض')+'. '+C.aNote}</p></div>
<div class="card"><h2>٧. التفسير التربوي والتوصيات</h2>${[['✅ نقاط القوة',R.S],['⚠ جوانب التحسين',R.I],['🛠 التوصيات العلاجية',R.R],['🚀 التوصيات الإثرائية',R.E],['👩‍🏫 التوصيات التدريسية',R.T]].map(x=>`<h3>${x[0]}</h3><ul>${x[1].map(t=>`<li>${t}</li>`).join('')}</ul>`).join('')}<div class="ph" style="margin-top:30px"><p>ملاحظات: ______________________________________________</p><p>توقيع المعلم: ____________ &nbsp; توقيع المشرف: ____________</p></div></div>`;
const mk=(id,cfg)=>CH.push(new Chart($(id),{...cfg,options:{maintainAspectRatio:false,animation:false,plugins:{legend:{display:cfg.type=='pie'}},scales:cfg.type=='pie'?{}:{y:{beginAtZero:true}}}})),cl=['#16a34a','#22c55e','#3b82f6','#f59e0b','#ef4444'];
mk('#c1',{type:'pie',data:{labels:C.L.map(l=>l.n),datasets:[{data:C.L.map(l=>l.c),backgroundColor:cl}]}});mk('#c2',{type:'bar',data:{labels:C.L.map(l=>l.n),datasets:[{data:C.L.map(l=>l.c),backgroundColor:cl}]}});mk('#c3',{type:'bar',data:{labels:C.q.map(x=>'س'+ad(x.i+1)),datasets:[{label:'٪',data:C.q.map(x=>+x.pct.toFixed(1)),backgroundColor:C.q.map(x=>x.pct>=ST.hi?'#16a34a':x.pct<ST.lo?'#ef4444':'#3b82f6')}]},options:0});mk('#c4',{type:'bar',data:{labels:C.cg.map(x=>x.c),datasets:[{data:C.cg.map(x=>+x.pct.toFixed(1)),backgroundColor:'#1e3a8a'}]}});mk('#c5',{type:'bar',data:{labels:C.hist.map((_,i)=>ad(i*10)+'–'+ad(i*10+10)),datasets:[{label:'عدد الطلبة',data:C.hist,backgroundColor:'#3b82f6'}]}})}
function xls(){const a=W,C=calc(a),wb=XLSX.utils.book_new(),A=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),n);
A('البيانات الأساسية',[['العنوان',a.title],['النوع',a.type],['المادة',a.subject],['الصف',a.grade],['الشعبة',a.section],['الفصل',a.term],['العام',a.year],['المعلم',a.teacher],['التاريخ',a.date],['الدرجة النهائية',C.tot]]);
A('درجات الطلبة',[['الطالب',...a.qs.map((q,i)=>'س'+(i+1)+' ('+q.pts+')'),'المجموع','٪','التقدير'],...a.students.map((s,i)=>[showNames?s.name:'طالب '+(i+1),...s.s.map(Number),C.T[i],+C.P[i].toFixed(1),lvOf(C.P[i]).n])]);
A('تحليل الأسئلة',[['السؤال','الموضوع','القصوى','المتوسط','التحصيل ٪','الدرجة الكاملة','صفر','المستوى','التصنيف','التمييز'],...C.q.map(x=>[x.i+1,x.topic,x.pt,+x.mean.toFixed(2),+x.pct.toFixed(1),x.full,x.zero,x.lvl,x.cls,x.D==null?'':+x.D.toFixed(2)])]);
A('المستويات المعرفية',[['المستوى','عدد الأسئلة','الدرجات','التحصيل ٪'],...C.cg.map(x=>[x.c,x.k,x.pts,+x.pct.toFixed(1)])]);
A('الملخص الإحصائي',[['المؤشر','القيمة'],['عدد الطلبة',C.n],['المتوسط',+C.mean.toFixed(2)],['متوسط التحصيل ٪',+C.pm.toFixed(1)],['أعلى',C.max],['أدنى',C.min],['الوسيط',C.med],['الانحراف المعياري',+C.sd.toFixed(2)],['ألفا كرونباخ',C.alpha==null?'غير متاح':+C.alpha.toFixed(2)],...C.L.map(l=>[l.n,l.c])]);
dl((a.title||'تقرير')+'.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}))}
function settings(){const m=modal(`<h3>إعدادات المنصة</h3><p class="mu">حدود مستويات التحصيل (٪ كحد أدنى)</p>${ST.levels.map((l,i)=>`<label>${l.n}<input type="number" data-i="${i}" value="${l.min}" ${i==ST.levels.length-1?'disabled':''}></label>`).join('')}<label>حد الإجادة / ارتفاع التحصيل<input type="number" id="shi" value="${ST.hi}"></label><label>حد الدعم / انخفاض التحصيل<input type="number" id="slo" value="${ST.lo}"></label><div class="row"><button class="b p" id="sok">حفظ</button><button class="b" id="spw">تغيير كلمة مرور المشرف</button><button class="b" id="scn">إغلاق</button></div>`);$('#scn').onclick=()=>m.remove();$('#spw').onclick=()=>{if(API){m.remove();gate(async()=>{const n=prompt('كلمة المرور الجديدة (٦ أحرف فأكثر):');if(!n||n.length<6)return toast('لم تتغير كلمة المرور');try{await api('/auth','POST',{action:'change',new:n});PW=n;toast('تم تغيير كلمة المرور')}catch(e){toast('تعذر التغيير')}});return}if(!ST.pw)return toast('لم تُنشأ كلمة مرور بعد؛ ستُطلب عند فتح التقارير.');m.remove();gate(()=>{ST.pw=null;saveST();unlocked=false;gate(()=>go('home'))})};$('#sok').onclick=()=>{const v=[...m.querySelectorAll('[data-i]')].map(i=>+i.value);if(v.slice(0,-1).some((x,i)=>isNaN(x)||x<=(v[i+1]??0)))return toast('يجب أن تكون الحدود متناقصة من الأعلى إلى الأدنى');ST.levels.forEach((l,i)=>{if(i<v.length-1)l.min=v[i]});ST.hi=+$('#shi').value;ST.lo=+$('#slo').value;saveST();m.remove();toast('تم حفظ الإعدادات');go('home')}}
(async()=>{try{SUM=await api('/status');API=true;DB=[]}catch(e){}home()})();
</script></body></html>
